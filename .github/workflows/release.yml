name: Release

on:
  push:
    tags: ["v*"]

# Needed to create the GitHub Release and upload files to it.
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing shouldn't cancel the others
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: vitals-windows-x86_64
          # Build on the oldest supported Ubuntu: a binary built against a newer
          # glibc refuses to start on distros with an older one.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: vitals-linux-x86_64
          - os: macos-latest # Apple Silicon runner
            target: aarch64-apple-darwin
            name: vitals-macos-arm64
          - os: macos-latest # cross-compiles for Intel; Apple's toolchain supports both
            target: x86_64-apple-darwin
            name: vitals-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build
        shell: bash
        run: |
          # Windows: link the C runtime statically, so the .exe doesn't need the
          # Visual C++ Redistributable installed.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/vitals.exe -DestinationPath ${{ matrix.name }}.zip

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release vitals

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true # changelog built from commits and PRs since the last tag
